<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 15px; width: 320px; }
    h3 { margin-bottom: 10px; }
    button { background-color: #5B5FC7; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px;}
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    #status { margin-top: 10px; font-size: 12px; color: #333; }
    #timer { font-size: 24px; font-weight: bold; text-align: center; margin-top: 10px; display: none; color: #5B5FC7; }
    
    a, a:visited, a:hover, a:active {
      color: #0066cc !important;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }

    /* Views */
    .view-section { display: none; }
  </style>
</head>
<body>
  <div style="display: flex; justify-content: space-between; align-items: flex-start;">
    <h3 style="margin: 0;">mast</h3>
    <div style="text-align: right;">
      <a href="#" id="settingsLink" style="font-size: 12px; font-weight: bold;">Settings</a>
      <div style="font-size: 10px; color: #888; margin-top: 3px;">Version 1.6</div>
    </div>
  </div>
  
  <div id="view-api-key" class="view-section">
    <p style="font-size: 12px; color: #555;">Please enter your API key to get started.</p>
    <input type="password" id="apiKeyInput" placeholder="AIzaSy..." style="width: 100%; padding: 6px; box-sizing: border-box;">
    <button id="validateBtn">Save & Validate</button>
    <div id="apiError" style="color: red; font-size: 11px; margin-top: 5px; display: none;"></div>
    <div style="font-size: 11px; margin-top: 10px; color: #666;">
      Generate an API key from <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>.
    </div>
  </div>

  <div id="view-captions" class="view-section">
    <div style="background: #fff3cd; color: #856404; padding: 10px; border-radius: 4px; font-size: 12px; text-align: center; margin-top: 15px; border: 1px solid #ffeeba;">
      <strong>Waiting for Captions</strong><br>
      Please turn on Live Captions in Teams.<br>
      <kbd style="background: #fff; border: 1px solid #ccc; padding: 1px 4px; border-radius: 3px; display: inline-block; margin-top: 5px;">Alt+Shift+C</kbd>
    </div>
  </div>

  <div id="view-main" class="view-section">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 15px;">
      <button id="startBtn">Start AI Notes</button>
      <a href="#" id="stopLink" style="display: none; font-size: 14px; font-weight: bold; color: #d9534f !important;">Stop</a>
    </div>
    
    <div id="timer">00:00</div>
    
    <div id="status"></div>
    
    <div style="margin-top: 15px; display: flex; flex-direction: column; gap: 8px;">
      <a href="#" id="generateLink" style="display: none; font-weight: bold;">Generate AI Summary</a>
      <a href="#" id="downloadLink" style="display: none; font-size: 12px;">Download Raw Transcript</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
