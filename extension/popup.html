<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; width: 300px; padding: 15px; text-align: center; }
    button { color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; width: 100%; margin-top: 10px; }
    #startBtn { background-color: #107C41; } /* Green */
    #generateBtn { background-color: #5B5FC7; } /* Teams Purple */
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    #status { margin-top: 15px; font-size: 12px; color: #555; }
    #stopLink:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h3>Teams AI Minutes</h3>
  <p>Turn on Live Captions in Teams.</p>
  
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px;">
    <button id="startBtn" style="margin-top: 0;">Start Transcribing</button>
    <a href="#" id="stopLink" style="display: none; font-size: 12px; color: #C50F1F; text-decoration: none; white-space: nowrap;">Stop transcribing</a>
  </div>
  <button id="generateBtn" disabled>Generate Minutes</button>
  
  <div id="status">Ready.</div>
  
  <script src="popup.js"></script>
</body>
</html>
